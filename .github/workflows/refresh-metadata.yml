name: Refresh Repository Metadata

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  refresh-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run refresh:metadata
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Commit changes
        run: |
          if [[ -n "$(git status --porcelain src/data/repos.json src/data/history.json)" ]]; then
            git config user.name github-actions
            git config user.email github-actions@users.noreply.github.com
            git add src/data/repos.json src/data/history.json
            git commit -m "chore(data): refresh repository metadata"
            git push
          fi
